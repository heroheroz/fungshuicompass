.big { font-size: 30px; font-weight: 700; font-family: var(--f-mono); }
.empty { padding: 30px; text-align: center; }

<body>
<div class="wrap">
  <header>
    <div><h1>風水<span>羅盤</span> · <span id="tTitle"></span></h1><p class="note" id="tSub"></p></div>
    <div class="row"><a class="btn" href="index.html" id="tBack"></a>
      <div class="group"><button type="button" data-lang="zh">繁體中文</button><button type="button" data-lang="en">English</button></div></div>
  </header>
  <main id="view"></main>
</div>
<script src="config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(() => {
const $ = s => document.querySelector(s);
const C = window.FS_CLOUD && window.FS_CLOUD.url ? window.FS_CLOUD : null;
let lang = 'zh';
try { lang = localStorage.getItem('fs-gallery-lang') || (JSON.parse(localStorage.getItem('luopan-reader-v1') || '{}').lang) || 'zh'; } catch (e) { /* storage off */ }
if (lang !== 'en') lang = 'zh';
const tr = (z, e) => lang === 'en' ? e : z;
const pick = a => a[lang === 'en' ? 1 : 0];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const DIRS = [['北', 'North'], ['東北', 'Northeast'], ['東', 'East'], ['東南', 'Southeast'], ['南', 'South'], ['西南', 'Southwest'], ['西', 'West'], ['西北', 'Northwest']];
const SCHOOL = { naqi: ['納氣', 'Na Qi'], flying: ['玄空飛星', 'Flying Stars'], mansion: ['八宅', 'Eight Mansions'] };
// Assessment template: each item has options [value, zh, en, tone]
const G3 = [['good', '好', 'good', 'good'], ['mid', '一般', 'fair', 'mid'], ['bad', '差', 'poor', 'bad']];
const LUCK = [['good', '吉', 'lucky', 'good'], ['mid', '平', 'neutral', 'mid'], ['bad', '凶', 'unlucky', 'bad']];
const NOYES = [['no', '冇', 'no', 'good'], ['yes', '有', 'yes', 'bad']];
const CHECKS = [
  { sec: ['屋內格局', 'Inside the flat'], items: [
    { k: 'taiji', l: ['太極點（屋中心）', 'Taiji point (centre)'], h: ['圖上中心點擺得啱唔啱', 'Is the centre marked correctly?'], o: [['ok', '準確', 'correct', 'good'], ['off', '有偏差', 'off', 'mid'], ['wrong', '錯誤', 'wrong', 'bad']] },
    { k: 'door', l: ['大門座向', 'Front door direction'], o: LUCK },
    { k: 'window', l: ['窗戶座向', 'Window directions'], o: LUCK },
    { k: 'beam', l: ['橫樑', 'Beams'], h: ['有冇樑壓床、壓沙發或書枱', 'Beams over the bed, sofa or desk?'], o: [['no', '冇', 'none', 'good'], ['minor', '有，唔壓位', 'yes, clear', 'mid'], ['press', '有，壓位', 'yes, over a seat', 'bad']] },
    { k: 'pillar', l: ['柱位／凸角', 'Pillars or corners'], h: ['房內有冇柱或尖角', 'Pillars or sharp corners in rooms?'], o: NOYES },
    { k: 'centre', l: ['中宮壓水火', 'Water or fire at the centre'], h: ['十字線中間有冇廁所或廚房', 'Toilet or kitchen on the centre cross?'], o: NOYES },
    { k: 'wcKitchen', l: ['廁所廚房對沖', 'Toilet facing kitchen'], o: NOYES },
    { k: 'doorDoor', l: ['門對門', 'Doors facing doors'], o: NOYES },
  ] },
  { sec: ['四象及外局', 'Four symbols and surroundings'], items: [
    { k: 'dragon', l: ['青龍（左）', 'Azure Dragon (left)'], o: G3 },
    { k: 'tiger', l: ['白虎（右）', 'White Tiger (right)'], o: G3 },
    { k: 'tortoise', l: ['玄武（後）', 'Black Tortoise (back)'], o: G3 },
    { k: 'bird', l: ['朱雀（前）', 'Vermilion Bird (front)'], o: G3 },
    { k: 'motion', l: ['動象', 'Movement outside'], h: ['馬路、天橋、水流、工地等', 'Roads, flyovers, water, building works'], o: [['good', '吉', 'helpful', 'good'], ['none', '冇', 'none', 'mid'], ['bad', '凶', 'harmful', 'bad']] },
  ] },
];
const ITEMS = {}; CHECKS.forEach(s => s.items.forEach(i => ITEMS[i.k] = i));
const AUTO_L = { taiji: ['太極點', 'Taiji point'], door: ['大門', 'Door'], window: ['窗戶', 'Windows'], bed: ['床位', 'Bed'], sofa: ['沙發', 'Sofa'], centre: ['中宮水火', 'Centre'],
  beam: ['橫樑', 'Beams'], pillar: ['柱位', 'Pillars'], wcKitchen: ['廁廚對沖', 'Toilet vs kitchen'], doorDoor: ['門對門', 'Door to door'], dragon: ['青龍', 'Dragon'], tiger: ['白虎', 'Tiger'], tortoise: ['玄武', 'Tortoise'], bird: ['朱雀', 'Bird'], motion: ['動象', 'Movement'] };
const avg = a => a.length ? Math.round(a.reduce((x, y) => x + y, 0) / a.length * 10) / 10 : null;
const api = (path, opts = {}) => fetch(C.url.replace(/\/$/, '') + path, { ...opts, headers: { apikey: C.key, Authorization: 'Bearer ' + C.key, ...(opts.headers || {}) } })
  .then(r => r.ok ? r.json().catch(() => null) : r.text().then(t => { throw new Error(t || r.status); }));
const pic = p => p ? C.url.replace(/\/$/, '') + '/storage/v1/object/public/plans/' + p : '';
const gmaps = p => p.lat != null ? `https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lng}` : `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent([p.building, p.address].filter(Boolean).join(' '))}`;
const unitText = p => [p.block && tr(`${p.block}座`, `Block ${p.block}`), p.floor && tr(`${p.floor}樓`, `Floor ${p.floor}`), p.unit && tr(`${p.unit}室`, `Unit ${p.unit}`)].filter(Boolean).join(' · ');
const stars = n => n ? '★★★★★'.slice(0, Math.round(n)) + '☆☆☆☆☆'.slice(0, 5 - Math.round(n)) : '';
const when = t => new Date(t).toLocaleDateString(lang === 'en' ? 'en-GB' : 'zh-HK', { year: 'numeric', month: 'short', day: 'numeric' });
const G = { plans: [], stats: {}, q: '', facing: 'all', sort: 'new', mode: 'plans', map: null, layer: null };
let rated = {};
try { rated = JSON.parse(localStorage.getItem('fs-gallery-rated') || '{}'); } catch (e) { /* storage off */ }

function chrome() {
  document.documentElement.lang = lang === 'en' ? 'en' : 'zh-Hant';
  document.title = tr('風水羅盤 · 社群圖庫', 'Feng Shui Compass · Gallery');
  $('#tTitle').textContent = tr('社群圖庫', 'Gallery');
  $('#tSub').textContent = tr('用戶分享嘅戶型及羅盤，歡迎留下風水評論，同評分準唔準。', 'Plans and compass readings shared by users. Leave a feng shui assessment and rate how accurate each reading is.');
  $('#tBack').textContent = tr('← 返回羅盤', '← Back to the compass');
  document.querySelectorAll('[data-lang]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
}
function load() {
  return Promise.all([
    api('/rest/v1/plans?select=id,created_at,building,block,floor,unit,address,lat,lng,facing,sector,label,label_en,school,period,author,image_path,score&order=created_at.desc&limit=1000'),
    api('/rest/v1/plan_stats?select=*').catch(() => []),
  ]).then(([p, s]) => { G.plans = p || []; G.stats = {}; (s || []).forEach(x => G.stats[x.id] = x); });
}
function visible() {
  const q = G.q.trim().toLowerCase();
  let v = G.plans.filter(p => (G.facing === 'all' || String(p.sector) === G.facing) && (!q || [p.building, p.block, p.floor, p.unit, p.address, p.label, p.author].join(' ').toLowerCase().includes(q)));
  const st = (p, k) => +((G.stats[p.id] || {})[k] || 0);
  if (G.sort === 'score') v = v.slice().sort((a, b) => (+b.score || 0) - (+a.score || 0));
  if (G.sort === 'rated') v = v.slice().sort((a, b) => st(b, 'avg_score') - st(a, 'avg_score'));
  if (G.sort === 'talk') v = v.slice().sort((a, b) => st(b, 'comment_count') - st(a, 'comment_count'));
  return v;
}
function listView() {
  $('#view').innerHTML = `
  <div class="top">
    <div class="card"><div class="row" style="justify-content:space-between;margin-bottom:8px"><h2 style="margin:0">${tr('篩選', 'Filter')}</h2>
      <span class="group"><button type="button" data-mode="plans" aria-pressed="${G.mode === 'plans'}">${tr('單位', 'Flats')}</button><button type="button" data-mode="buildings" aria-pressed="${G.mode === 'buildings'}">${tr('大廈', 'Buildings')}</button></span></div>
      <div class="filters"><input type="text" id="q" value="${esc(G.q)}" placeholder="${tr('搜尋大廈、座、樓層、單位、地址…', 'Search building, block, floor, unit, address…')}">
        <select id="facing"><option value="all">${tr('全部座向', 'Any facing')}</option>${DIRS.map((d, i) => `<option value="${i}" ${G.facing === String(i) ? 'selected' : ''}>${tr('向' + d[0], 'Faces ' + d[1])}</option>`).join('')}</select>
        <select id="sort"><option value="new">${tr('最新', 'Newest')}</option><option value="score" ${G.sort === 'score' ? 'selected' : ''}>${tr('風水評分最高', 'Best feng shui score')}</option><option value="rated" ${G.sort === 'rated' ? 'selected' : ''}>${tr('準確度最高', 'Most accurate')}</option><option value="talk" ${G.sort === 'talk' ? 'selected' : ''}>${tr('最多評論', 'Most discussed')}</option></select></div>
      <p class="note" id="count"></p></div>
    <div class="map" id="map"></div>
  </div>
  <div class="grid" id="grid"></div>`;
  tiles(); mapInit();
}
function buildingsHTML(v) {
  // groups shared flats by building, then by block, averaging the feng shui score and accuracy ratings
  const B = {};
  v.forEach(p => { const k = p.building.trim(); (B[k] = B[k] || []).push(p); });
  const rows = Object.entries(B).map(([name, list]) => ({ name, list, score: avg(list.filter(p => p.score != null).map(p => +p.score)) })).sort((a, b) => (b.score || 0) - (a.score || 0));
  if (!rows.length) return `<div class="card empty note">${tr('冇符合嘅大廈。', 'No matching buildings.')}</div>`;
  return rows.map(b => { const blocks = {};
    b.list.forEach(p => { const k = p.block || '—'; (blocks[k] = blocks[k] || []).push(p); });
    const acc = avg(b.list.map(p => +((G.stats[p.id] || {}).avg_score || 0)).filter(Boolean));
    return `<div class="card bld"><div class="row" style="justify-content:space-between"><b style="font-size:16px">${esc(b.name)}</b><span><span class="stars">${stars(b.score)}</span> ${b.score ?? '—'} <span class="note">${tr(`${b.list.length} 個單位`, `${b.list.length} flats`)}${acc ? tr(` · 準確度 ${acc}`, ` · accuracy ${acc}`) : ''}</span></span></div>
      <table class="blk"><thead><tr><th>${tr('座', 'Block')}</th><th>${tr('單位', 'Flats')}</th><th>${tr('風水評分', 'Score')}</th><th>${tr('座向', 'Facing')}</th></tr></thead><tbody>${Object.entries(blocks).sort().map(([k, ps]) => { const sc = avg(ps.filter(p => p.score != null).map(p => +p.score)), fac = [...new Set(ps.map(p => lang === 'en' ? p.label_en : p.label).filter(Boolean))];
        return `<tr><td>${esc(k)}</td><td>${ps.map(p => `<a href="#${p.id}">${esc([p.floor && tr(p.floor + '樓', 'F' + p.floor), p.unit].filter(Boolean).join(' ') || tr('單位', 'flat'))}</a>`).join('、')}</td><td><span class="stars">${stars(sc)}</span> ${sc ?? '—'}</td><td class="note">${esc(fac.join('、'))}</td></tr>`; }).join('')}</tbody></table></div>`; }).join('');
}
function tiles() {
  const v = visible();
  if (G.mode === 'buildings') { $('#count').textContent = tr(`共 ${new Set(v.map(p => p.building.trim())).size} 座大廈`, `${new Set(v.map(p => p.building.trim())).size} buildings`); $('#grid').className = 'blist'; $('#grid').innerHTML = buildingsHTML(v); mapDraw(); return; }
  $('#grid').className = 'grid';
  $('#count').textContent = tr(`共 ${v.length} 個戶型`, `${v.length} plans`);
  $('#grid').innerHTML = v.length ? v.map(p => { const s = G.stats[p.id] || {};
    return `<button type="button" class="tile" data-open="${p.id}"><img loading="lazy" src="${pic(p.image_path)}" alt="">
      <span class="m"><b>${esc(p.building)}</b><span>${esc(unitText(p))}</span>
      <span class="note">${esc(lang === 'en' ? p.label_en : p.label)} · ${pick(SCHOOL[p.school] || ['', ''])}</span>
      <span>${p.score != null ? `${tr('風水', 'Feng shui')} <span class="stars">${stars(p.score)}</span> ${p.score}` : ''}</span>
      <span class="note">${s.rating_count ? tr(`準確度 ${s.avg_score}（${s.rating_count}）`, `Accuracy ${s.avg_score} (${s.rating_count})`) : tr('未有準確度評分', 'No accuracy ratings yet')} · ${tr(`${s.comment_count || 0} 個評論`, `${s.comment_count || 0} comments`)}</span></span></button>`; }).join('')
    : `<div class="card empty note">${G.plans.length ? tr('冇符合嘅戶型。', 'No matching plans.') : tr('未有人分享。喺羅盤頁「資料庫」撳「儲存並分享到社群」就會出現喺度。', 'Nothing shared yet. Use "Save and share" in the compass Library tab and it will appear here.')}</div>`;
  mapDraw();
}
function mapInit() {
  if (!window.L) { $('#map').innerHTML = `<p class="note" style="padding:12px">${tr('地圖載入唔到。', 'The map could not load.')}</p>`; return; }
  G.map = L.map('map').setView([22.3193, 114.1694], 11);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(G.map);
  G.layer = L.layerGroup().addTo(G.map); mapDraw(true);
}
function mapDraw(fit) {
  if (!G.map) return;
  G.layer.clearLayers(); const pts = [];
  visible().forEach(p => { if (p.lat == null) return; pts.push([p.lat, p.lng]);
    L.circleMarker([p.lat, p.lng], { radius: 8, color: '#fff', weight: 2, fillColor: '#c4271c', fillOpacity: .95 }).addTo(G.layer)
      .bindPopup(`<div class="pop"><img src="${pic(p.image_path)}" alt=""><b>${esc(p.building)}</b><br>${esc(unitText(p))}<br><a href="#${p.id}">${tr('睇詳情', 'View')}</a></div>`); });
  if (fit && pts.length) G.map.fitBounds(pts, { padding: [30, 30], maxZoom: 16 });
}
function chipsHTML(checks) {
  if (!checks) return '';
  const out = Object.entries(checks).map(([k, v]) => { const it = ITEMS[k], o = it && it.o.find(x => x[0] === v); return o ? `<span class="chip ${o[3]}">${pick(it.l)}：${tr(o[1], o[2])}</span>` : ''; }).join('');
  return out ? `<div class="chips">${out}</div>` : '';
}
function templateHTML() {
  return CHECKS.map(s => `<h3>${pick(s.sec)}</h3><div class="tpl">` + s.items.map(i => `<span>${pick(i.l)}${i.h ? `<span class="hint">${pick(i.h)}</span>` : ''}</span>
    <span class="opts" data-k="${i.k}">${i.o.map(o => `<button type="button" class="${o[3]}" data-v="${o[0]}" aria-pressed="false">${tr(o[1], o[2])}</button>`).join('')}</span>`).join('') + `</div>`).join('');
}
function detailView(id) {
  $('#view').innerHTML = `<p class="note">${tr('載入中…', 'Loading…')}</p>`;
  const q = encodeURIComponent(id);
  Promise.all([api(`/rest/v1/plans?id=eq.${q}&select=*`), api(`/rest/v1/comments?plan_id=eq.${q}&order=created_at.asc`), api(`/rest/v1/ratings?plan_id=eq.${q}&order=created_at.desc`)])
    .then(([pl, cm, rt]) => {
      const p = pl && pl[0]; if (!p) { $('#view').innerHTML = `<div class="card empty note">${tr('搵唔到呢個戶型。', 'This plan was not found.')} <a href="#">${tr('返回圖庫', 'Back to the gallery')}</a></div>`; return; }
      cm = cm || []; rt = rt || [];
      const avg = rt.length ? Math.round(rt.reduce((a, r) => a + r.score, 0) / rt.length * 10) / 10 : 0;
      $('#view').innerHTML = `
      <p><a href="#">← ${tr('返回圖庫', 'Back to the gallery')}</a></p>
      <div class="detail">
        <div class="side">
          <div class="pic"><a href="${pic(p.image_path)}" target="_blank" rel="noopener"><img src="${pic(p.image_path)}" alt="${esc(p.building)}"></a></div>
          <div class="card"><h2>${esc(p.building)} ${esc(unitText(p))}</h2>
            <dl class="kv">
              <dt>${tr('座向', 'Facing')}</dt><dd>${esc(lang === 'en' ? p.label_en : p.label)}${p.facing != null ? ` · ${p.facing}°` : ''}</dd>
              ${p.score != null ? `<dt>${tr('風水評分', 'Feng shui score')}</dt><dd><span class="stars">${stars(p.score)}</span> ${p.score} / 5</dd>` : ''}
              <dt>${tr('羅盤', 'Compass')}</dt><dd>${pick(SCHOOL[p.school] || ['—', '—'])}${p.period ? tr(` · ${'一二三四五六七八九'[p.period - 1]}運`, ` · Period ${p.period}`) : ''}</dd>
              ${p.address ? `<dt>${tr('地址', 'Address')}</dt><dd>${esc(p.address)}</dd>` : ''}
              <dt>${tr('地圖', 'Map')}</dt><dd><a href="${gmaps(p)}" target="_blank" rel="noopener">Google Maps ↗</a></dd>
              <dt>${tr('分享者', 'Shared by')}</dt><dd>${esc(p.author || tr('匿名', 'Anonymous'))} · ${when(p.created_at)}</dd>
              ${p.notes ? `<dt>${tr('備註', 'Notes')}</dt><dd>${esc(p.notes)}</dd>` : ''}
            </dl>
            ${p.assessment ? `<div class="chips">${Object.entries(p.assessment).map(([k, a]) => `<span class="chip ${a.s >= 4 ? 'good' : a.s >= 3 ? 'mid' : 'bad'}">${pick(AUTO_L[k] || [k, k])} ${'★'.repeat(a.s)}</span>`).join('')}</div>` : ''}
            ${p.plan_path ? `<p class="note"><a href="${pic(p.plan_path)}" target="_blank" rel="noopener">${tr('睇原本戶型圖 ↗', 'Original floor plan ↗')}</a></p>` : ''}
          </div>
        </div>
        <div class="side">
          <section class="card"><h2>${tr('風水評論', 'Feng shui assessments')} (${cm.length})</h2>
            <div class="list">${cm.length ? cm.map(c => `<div class="msg"><span class="who">${esc(c.author || tr('匿名', 'Anonymous'))}</span><span class="when">${when(c.created_at)}</span>${c.overall ? ` <span class="stars">${stars(c.overall)}</span>` : ''}${chipsHTML(c.checks)}${c.body ? `<p>${esc(c.body)}</p>` : ''}</div>`).join('') : `<p class="note">${tr('未有評論，做第一個評下呢個單位嘅風水。', 'No assessments yet. Be the first to assess this flat.')}</p>`}</div>
            <form class="form" id="cForm">
              <details open><summary>${tr('評估範本（揀適用嘅項目）', 'Assessment template (pick what applies)')}</summary>${templateHTML()}
                <h3>${tr('整體風水', 'Overall feng shui')}</h3><span class="pick" id="ovPick">${[1, 2, 3, 4, 5].map(n => `<button type="button" data-score="${n}" aria-label="${n}">★</button>`).join('')}</span></details>
              <textarea name="body" rows="4" maxlength="2000" placeholder="${tr('補充評語：例如房間嘅四象、樑柱位置、化解建議…', 'More detail: the four symbols of each room, beam positions, remedies…')}"></textarea>
              <input type="text" name="author" maxlength="60" placeholder="${tr('你嘅稱呼（選填）', 'Your name (optional)')}">
              <div class="row"><button class="btn primary">${tr('發佈評論', 'Post assessment')}</button><span class="note" id="cMsg"></span></div></form>
          </section>
          <section class="card"><h2>${tr('準確度評分', 'Accuracy rating')}</h2>
            <p>${rt.length ? `<span class="big">${avg}</span> <span class="stars">${stars(avg)}</span> <span class="note">${tr(`${rt.length} 個評分`, `${rt.length} ratings`)}</span>` : `<span class="note">${tr('未有評分。', 'No ratings yet.')}</span>`}</p>
            <p class="note">${tr('住過或者睇過呢個單位？覺得羅盤分析準唔準？', 'Lived in or visited this flat? How accurate was the reading?')}</p>
            ${rated[id] ? `<p class="note">${tr('你已經評過分，多謝！', 'You have rated this plan. Thank you!')}</p>` : `
            <form class="form" id="rForm"><span class="pick" id="pick">${[1, 2, 3, 4, 5].map(n => `<button type="button" data-score="${n}" aria-label="${n}">★</button>`).join('')}</span>
              <input type="text" name="author" maxlength="60" placeholder="${tr('你嘅稱呼（選填）', 'Your name (optional)')}"><textarea name="body" rows="2" maxlength="1000" placeholder="${tr('邊度準、邊度唔準？（選填）', 'What matched and what did not? (optional)')}"></textarea>
              <div class="row"><button class="btn primary" disabled id="rBtn">${tr('提交評分', 'Submit rating')}</button><span class="note" id="rMsg"></span></div></form>`}
            <div class="list">${rt.filter(r => r.body || r.author).map(r => `<div class="msg"><span class="stars">${stars(r.score)}</span> <span class="who">${esc(r.author || tr('匿名', 'Anonymous'))}</span><span class="when">${when(r.created_at)}</span>${r.body ? `<p>${esc(r.body)}</p>` : ''}</div>`).join('')}</div>
          </section>
        </div>
      </div>`;
      const checks = {}; let overall = 0, score = 0;
      const stars5 = (box, n) => box.querySelectorAll('button').forEach(x => x.classList.toggle('on', +x.dataset.score <= n));
      const cf = $('#cForm');
      cf.addEventListener('click', e => {
        const b = e.target.closest('.opts button');
        if (b) { const k = b.parentNode.dataset.k, v = b.dataset.v; checks[k] = checks[k] === v ? undefined : v; if (!checks[k]) delete checks[k];
          b.parentNode.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(checks[k] === x.dataset.v))); }
        const s = e.target.closest('#ovPick [data-score]'); if (s) { overall = +s.dataset.score; stars5($('#ovPick'), overall); }
      });
      cf.addEventListener('submit', e => { e.preventDefault(); const f = new FormData(cf), body = String(f.get('body')).trim();
        const hasChecks = Object.keys(checks).length > 0;
        if (!body && !hasChecks && !overall) { $('#cMsg').textContent = tr('請揀最少一項或者寫低評語。', 'Pick at least one item or write a comment.'); return; }
        $('#cMsg').textContent = tr('發佈中…', 'Posting…');
        api('/rest/v1/comments', { method: 'POST', headers: { 'Content-Type': 'application/json', Prefer: 'return=minimal' },
          body: JSON.stringify({ plan_id: id, author: String(f.get('author')).trim() || null, body: body || null, checks: hasChecks || overall ? checks : null, overall: overall || null }) })
          .then(() => detailView(id)).catch(() => { $('#cMsg').textContent = tr('發佈失敗，請再試。', 'Could not post. Please try again.'); }); });
      const rf = $('#rForm'); if (rf) {
        $('#pick').addEventListener('click', e => { const b = e.target.closest('[data-score]'); if (!b) return; score = +b.dataset.score; stars5($('#pick'), score); $('#rBtn').disabled = false; });
        rf.addEventListener('submit', e => { e.preventDefault(); if (!score) return; const f = new FormData(rf);
          $('#rMsg').textContent = tr('提交中…', 'Sending…');
          api('/rest/v1/ratings', { method: 'POST', headers: { 'Content-Type': 'application/json', Prefer: 'return=minimal' }, body: JSON.stringify({ plan_id: id, score, author: String(f.get('author')).trim() || null, body: String(f.get('body')).trim() || null }) })
            .then(() => { rated[id] = 1; try { localStorage.setItem('fs-gallery-rated', JSON.stringify(rated)); } catch (e2) { /* storage off */ } detailView(id); })
            .catch(() => { $('#rMsg').textContent = tr('提交失敗，請再試。', 'Could not send. Please try again.'); }); });
      }
    }).catch(() => { $('#view').innerHTML = `<div class="card empty note">${tr('載入失敗，請重新整理。', 'Could not load. Please refresh.')}</div>`; });
}
function route() {
  chrome(); G.map = null;
  if (!C) { $('#view').innerHTML = `<div class="card empty note">${tr('社群圖庫未設定好。', 'The gallery is not set up yet.')}</div>`; return; }
  const id = location.hash.slice(1);
  if (id) { detailView(id); window.scrollTo(0, 0); }
  else load().then(listView).catch(() => { $('#view').innerHTML = `<div class="card empty note">${tr('載入失敗，請重新整理。', 'Could not load. Please refresh.')}</div>`; });
}
document.addEventListener('input', e => { if (e.target.id === 'q') { G.q = e.target.value; tiles(); } });
document.addEventListener('change', e => { if (e.target.id === 'facing') { G.facing = e.target.value; tiles(); mapDraw(true); } if (e.target.id === 'sort') { G.sort = e.target.value; tiles(); } });
document.addEventListener('click', e => {
  const o = e.target.closest('[data-open]'); if (o) location.hash = o.dataset.open;
  const md = e.target.closest('[data-mode]'); if (md) { G.mode = md.dataset.mode; document.querySelectorAll('[data-mode]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === G.mode))); tiles(); }
  const l = e.target.closest('[data-lang]'); if (l) { lang = l.dataset.lang; try { localStorage.setItem('fs-gallery-lang', lang); } catch (e2) { /* storage off */ } route(); }
});
window.addEventListener('hashchange', route);
route();
})();
</script>
