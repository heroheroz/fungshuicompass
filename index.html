<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>風水羅盤</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700;900&display=swap">
<style>
/* Layout: instrument bench. The plan sits on a drafting surface on the left, the reading ledger runs down the right; stacked on phones. */
:root {
  --n1: #c4271c; --n5: #8a5a2b; --n6: #2c8a6a; --nz: #2f78c4;
  --bg: #eef0ec;
  --surface: #f9faf7;
  --stage: #e3e6e0;
  --ink: #1b2320;
  --muted: #5c6862;
  --line: #cfd5cd;
  --cinnabar: #b8321f;
  --cinnabar-soft: #f4dcd6;
  --jade: #2c6b58;
  --jade-soft: #d6e8e0;
  --brass: #94721f;
  --brass-soft: #f1e6c8;
  --focus: #2c6b58;
  --f-display: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --f-body: "IBM Plex Sans", "Noto Sans TC", system-ui, -apple-system, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --n1: #ec6a52; --n5: #c99a6a; --n6: #67b89c; --nz: #6fa8e6;
    --bg: #111614; --surface: #18201d; --stage: #0c100e; --ink: #e4e9e5; --muted: #95a29b; --line: #2c3833;
    --cinnabar: #ec6a52; --cinnabar-soft: #3c1f19; --jade: #67b89c; --jade-soft: #173229; --brass: #d3ac52; --brass-soft: #362c14; --focus: #67b89c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --n1: #ec6a52; --n5: #c99a6a; --n6: #67b89c; --nz: #6fa8e6;
  --bg: #111614; --surface: #18201d; --stage: #0c100e; --ink: #e4e9e5; --muted: #95a29b; --line: #2c3833;
  --cinnabar: #ec6a52; --cinnabar-soft: #3c1f19; --jade: #67b89c; --jade-soft: #173229; --brass: #d3ac52; --brass-soft: #362c14; --focus: #67b89c;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.55; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

.app { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 16px; padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1600px; margin: 0 auto; }
@media (max-width: 980px) { .app { grid-template-columns: minmax(0, 1fr); } }

header.top { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; }
header.top .titles { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; flex: 1; min-width: 0; }
header.top h1 { font-family: var(--f-display); font-weight: 900; font-size: 26px; margin: 0; letter-spacing: 0.02em; }
header.top h1 span { color: var(--cinnabar); }
header.top p { margin: 0; color: var(--muted); }

.bench { min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.group { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.group button { border: 0; background: transparent; padding: 6px 11px; cursor: pointer; white-space: nowrap; }
.group button + button { border-left: 1px solid var(--line); }
.group button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: 8px; cursor: pointer; white-space: nowrap; }
.btn:hover, .group button:hover:not([aria-pressed="true"]) { background: var(--bg); }
.btn.primary { background: var(--cinnabar); border-color: var(--cinnabar); color: #fff; }
.btn:disabled { opacity: 0.45; cursor: default; }
.label-sm { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }

.targets { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 11px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.chip b { font-family: var(--f-display); font-weight: 700; }
.chip[aria-pressed="true"] { border-color: var(--cinnabar); background: var(--cinnabar-soft); color: var(--ink); }

.stage-wrap { position: relative; background: var(--stage); border-radius: 10px; display: flex; justify-content: center; align-items: center; min-height: 300px; overflow: hidden; }
.stage-wrap.drop { outline: 2px dashed var(--cinnabar); outline-offset: -8px; }
#stage { display: block; touch-action: none; user-select: none; -webkit-user-select: none; }
#stage.placing { cursor: crosshair; }
.ctrl { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 10px; }
.rots { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 6px 18px; }
.rot { display: grid; grid-template-columns: 96px minmax(0, 1fr) 40px auto; gap: 6px; align-items: center; font-size: 13px; }
.rot .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: middle; }
.mini { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 1px 6px; font-size: 12px; cursor: pointer; }
.mini:hover { border-color: var(--cinnabar); }
.cmps { display: flex; flex-direction: column; gap: 6px; border-top: 1px solid var(--line); padding-top: 8px; }
.cmp-row { display: grid; grid-template-columns: 86px minmax(120px, 180px) minmax(0, 1fr) minmax(0, 1fr) 28px; gap: 8px; align-items: center; font-size: 13px; }
.cmp-row label { display: grid; grid-template-columns: auto minmax(0, 1fr) 36px; gap: 6px; align-items: center; color: var(--muted); font-size: 12.5px; }
.cmp-row .zh { color: var(--ink); }
.cmp-row label.cmp-show { display: flex; gap: 6px; align-items: center; cursor: pointer; white-space: nowrap; }
.cmp-show input { accent-color: var(--cinnabar); width: 16px; height: 16px; margin: 0; }
@media (max-width: 640px) { .cmp-row { grid-template-columns: 1fr 1fr 28px; } .cmp-row label { grid-column: 1 / -1; } }
.zoom { position: absolute; bottom: 10px; right: 10px; display: flex; flex-direction: column; align-items: stretch; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
.zoom button { border: 0; background: transparent; padding: 5px 9px; cursor: pointer; font-size: 16px; line-height: 1.1; }
.zoom button:hover { background: var(--bg); }
.zoom #zoomFit { font-size: 11.5px; border-top: 1px solid var(--line); }
.zoom output { font-size: 11px; text-align: center; padding: 2px 4px; border-block: 1px solid var(--line); }
.hint { font-size: 12.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 14px; }
.sample-tag { position: absolute; bottom: 10px; left: 10px; background: var(--brass-soft); color: var(--ink); border: 1px solid var(--brass); padding: 2px 9px; border-radius: 6px; font-size: 12px; }

.ledger { min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; display: flex; flex-direction: column; align-self: start; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); max-height: calc(100vh - 24px); }
@media (max-width: 980px) { .ledger { position: static; max-height: none; } }
.tabs { display: flex; border-bottom: 1px solid var(--line); }
.tabs button { flex: 1; border: 0; background: transparent; padding: 11px 6px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; font-weight: 500; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--cinnabar); }
.pane { padding: 14px 16px 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; }
.pane h2 { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
.pane h3 { margin: 0; font-size: 15px; }
section.block { display: flex; flex-direction: column; gap: 8px; }

.field { display: grid; grid-template-columns: 112px minmax(0, 1fr) 52px; gap: 8px; align-items: center; }
.field label { color: var(--muted); font-size: 13px; }
.field output, .num { font-family: var(--f-mono); font-size: 12.5px; text-align: right; font-variant-numeric: tabular-nums; }
input[type="range"] { width: 100%; accent-color: var(--cinnabar); }
input[type="text"], input[type="number"], select { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 4px 7px; min-width: 0; width: 100%; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.checks { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; }
.checks label { display: flex; gap: 6px; align-items: center; font-size: 13px; }
.list { display: flex; flex-direction: column; gap: 6px; }
.list-item { display: grid; grid-template-columns: 28px minmax(0, 1fr) 110px 28px; gap: 6px; align-items: center; }
.list-item.win { grid-template-columns: 28px minmax(0, 1fr) 28px; }
.badge { display: inline-flex; align-items: center; justify-content: center; min-width: 24px; height: 22px; padding: 0 5px; border-radius: 5px; font-size: 11.5px; font-weight: 600; background: var(--bg); border: 1px solid var(--line); font-family: var(--f-mono); }
.icon-btn { border: 1px solid var(--line); background: transparent; border-radius: 6px; width: 28px; height: 28px; cursor: pointer; color: var(--muted); }
.icon-btn:hover { color: var(--cinnabar); border-color: var(--cinnabar); }
.note { font-size: 12.5px; color: var(--muted); margin: 0; }

/* Reading */
.house-card { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 4px 14px; align-items: center; background: var(--bg); }
.house-card .glyph { grid-row: span 3; font-family: var(--f-display); font-weight: 900; font-size: 54px; line-height: 1; color: var(--cinnabar); text-align: center; }
.house-card .glyph small { display: block; font-size: 12px; font-family: var(--f-body); font-weight: 500; color: var(--muted); margin-top: 4px; }
.house-card h3 { font-size: 16px; }
.kv { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 3px 10px; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; }
.zh { font-family: var(--f-display); font-weight: 700; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

.loshu { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; }
.cell { border-radius: 7px; padding: 6px 7px; min-height: 66px; display: flex; flex-direction: column; gap: 1px; font-size: 12px; border: 1px solid transparent; }
.cell .d { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; }
.cell .s { font-family: var(--f-display); font-weight: 700; font-size: 16px; }
.cell.good { background: var(--jade-soft); }
.cell.bad { background: var(--cinnabar-soft); }
.cell.mid { background: var(--bg); border-color: var(--line); align-items: center; justify-content: center; text-align: center; }
.cell.mid .s { font-size: 22px; color: var(--cinnabar); }

.pill { display: inline-flex; gap: 4px; align-items: center; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill.good { background: var(--jade-soft); color: var(--jade); }
.pill.bad { background: var(--cinnabar-soft); color: var(--cinnabar); }
.pill.warn { background: var(--brass-soft); color: var(--brass); }
.pill .zh { font-weight: 700; }
.nb { display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 22px; padding: 0 4px; border-radius: 5px; font-family: var(--f-mono); font-weight: 700; font-size: 13px; color: #fff; }
.nb.nz { background: var(--nz); } .t-nz { color: var(--nz); } .nb.n1 { background: var(--n1); } .nb.n5 { background: var(--n5); } .nb.n6 { background: var(--n6); }
.fs-cell { border-radius: 7px; padding: 6px 7px; min-height: 78px; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto 1fr auto; gap: 2px 4px; background: var(--bg); border: 1px solid var(--line); font-size: 11px; }
.fs-cell .d { grid-column: 1 / -1; color: var(--muted); display: flex; justify-content: space-between; }
.fs-cell .m, .fs-cell .w { font-family: var(--f-mono); font-weight: 700; font-size: 20px; line-height: 1; }
.fs-cell .w { text-align: right; }
.fs-cell .pd { grid-column: 1 / -1; text-align: center; font-family: var(--f-mono); font-size: 13px; color: var(--muted); }
.fs-cell.mid { border-color: var(--cinnabar); }
.nq-cell { border-radius: 7px; padding: 6px 8px; min-height: 78px; display: grid; grid-template-columns: 1fr auto; align-items: end; background: var(--bg); border: 1px solid var(--line); font-size: 11px; }
.nq-cell .d { grid-column: 1 / -1; align-self: start; color: var(--muted); display: flex; justify-content: space-between; gap: 4px; }
.nq-cell .n { font-family: var(--f-mono); font-weight: 700; font-size: 30px; line-height: 1; }
.nq-cell .zl { font-family: var(--f-serif, serif); font-weight: 900; font-size: 15px; }
.nq-cell.zheng .zl, .nq-cell.zheng .n { color: var(--nz); } .nq-cell.ling .zl, .nq-cell.ling .n { color: var(--n1); }
button.nq-cell { font: inherit; text-align: left; cursor: pointer; }
button.nq-cell:hover { border-color: var(--ink); }
.nq-cell.custom .d::after { content: '✎'; color: var(--muted); }
.nq-tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
.nq-cell.main { border-color: var(--cinnabar); border-width: 2px; }
.nq-cell.mid { display: flex; align-items: center; justify-content: center; color: var(--muted); }
.t-n1 { color: var(--n1); } .t-n5 { color: var(--n5); } .t-n6 { color: var(--n6); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); align-items: center; }
.callout { background: var(--brass-soft); border-radius: 6px; padding: 4px 8px; font-size: 13px; margin: 0; }

.item { border-left: 3px solid var(--line); padding: 2px 0 2px 11px; display: flex; flex-direction: column; gap: 4px; }
.item.good { border-left-color: var(--jade); }
.item.bad { border-left-color: var(--cinnabar); }
.item.warn { border-left-color: var(--brass); }
.item .head { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.item .head strong { font-size: 14px; }
.item p { margin: 0; font-size: 13px; }
.item .meta { font-size: 12px; color: var(--muted); }

table.ref { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.ref th, table.ref td { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.ref th { color: var(--muted); font-weight: 500; font-size: 11.5px; }
.tablewrap { overflow-x: auto; }

/* Compass skins (they sit on the plan image, so they follow their own look, chosen by the user) */
.c-nz { fill: var(--c-nz); }
.cmp-light { --c-nz: #2f78c4; --c-n1: #c4271c; --c-n5: #8a5a2b; --c-n6: #2c8a6a; }
.cmp-dark { --c-nz: #6fb0f0; --c-n1: #ff6a55; --c-n5: #d29a5f; --c-n6: #4fc19a; }
.c-n1 { fill: var(--c-n1); } .c-n5 { fill: var(--c-n5); } .c-n6 { fill: var(--c-n6); }
.cmp-light { --c-bg: #ffffff; --c-ink: #1d1d1b; --c-red: #c4271c; --c-line: #2d2d2b; --c-faint: #7d7d78; --c-good: #2c8a6a; --c-bad: #d0402f; }
.cmp-dark { --c-bg: #050505; --c-ink: #eeede8; --c-red: #ff5b47; --c-line: #d8d7d0; --c-faint: #9b9b95; --c-good: #4fc19a; --c-bad: #ff6a55; }
.c-bg { fill: var(--c-bg); }
.c-ink { fill: var(--c-ink); }
.c-red { fill: var(--c-red); }
.c-faint { fill: var(--c-faint); }
.c-stroke { stroke: var(--c-line); fill: none; }
.c-sector { stroke: var(--c-red); }
.c-good { fill: var(--c-good); }
.c-bad { fill: var(--c-bad); }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
/* Assessment */
.assess { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; background: var(--surface); }
.as-top { display: flex; align-items: baseline; gap: 10px; }
.as-stars { font-size: 28px; color: #b8860b; letter-spacing: 2px; }
.as-num { font-family: var(--f-mono); font-size: 16px; font-weight: 600; }
.as-list { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
.as-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 13px; }
.as-row .hint { display: block; color: var(--muted); font-size: 11.5px; }
.as-s { font-size: 14px; color: var(--muted); letter-spacing: 1px; white-space: nowrap; }
.as-s.good { color: var(--n6); } .as-s.mid { color: #b8860b; } .as-s.bad { color: var(--n1); }
.as-opts { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.as-opts button { border: 0; border-left: 1px solid var(--line); background: var(--bg); padding: 3px 8px; font-size: 12px; cursor: pointer; white-space: nowrap; }
.as-opts button:first-child { border-left: 0; }
.as-opts button[aria-pressed="true"].good { background: var(--n6); color: #fff; }
.as-opts button[aria-pressed="true"].mid { background: #b8860b; color: #fff; }
.as-opts button[aria-pressed="true"].bad { background: var(--n1); color: #fff; }
.assess details summary { cursor: pointer; font-weight: 600; font-size: 13px; margin-top: 10px; }
/* Library */
.lib-form { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.lib-form label, .lib-notes { display: flex; flex-direction: column; gap: 3px; font-size: 12.5px; color: var(--muted); }
.lib-form label.wide { grid-column: 1 / -1; }
.lib-search { display: flex; gap: 6px; }
.lib-notes textarea { font: inherit; color: inherit; border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 5px 7px; resize: vertical; }
.lib-results { display: flex; flex-direction: column; gap: 4px; }
.lib-res { text-align: left; border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 5px 8px; font-size: 12.5px; cursor: pointer; }
.lib-res:hover { border-color: var(--ink); }
.lib-point { font-size: 13px; margin: 0; }
.lib-point a, .lib-pop a { color: var(--cinnabar); }
.linkish { border: 0; background: none; padding: 0; color: var(--muted); text-decoration: underline; cursor: pointer; font-size: 12.5px; }
.lib-map { height: 280px; border-radius: 8px; border: 1px solid var(--line); overflow: hidden; background: var(--bg); z-index: 0; }
.lib-filter { display: grid; grid-template-columns: minmax(0, 1fr) 120px; gap: 8px; }
.lib-list { display: flex; flex-direction: column; gap: 14px; }
.lib-group h3 { font-size: 14px; margin: 0 0 6px; }
.lib-card { display: grid; grid-template-columns: 104px minmax(0, 1fr); gap: 10px; padding: 8px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 6px; }
.lib-card.on { border-color: var(--cinnabar); }
.lib-card img { width: 104px; height: 80px; object-fit: cover; border-radius: 5px; cursor: pointer; background: #fff; }
.lib-meta { display: flex; flex-direction: column; gap: 2px; font-size: 12.5px; min-width: 0; }
.lib-acts { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 4px; }
.lib-acts .btn { padding: 3px 8px; font-size: 12px; text-decoration: none; }
.lib-pop img { width: 180px; display: block; margin-bottom: 6px; border-radius: 4px; }
@media (max-width: 520px) { .lib-form { grid-template-columns: 1fr 1fr; } .lib-card { grid-template-columns: 1fr; } .lib-card img { width: 100%; height: auto; } }
/* Leaflet 1.9.4 (BSD-2-Clause) */

.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-tile-container,
.leaflet-pane > svg,
.leaflet-pane > canvas,
.leaflet-zoom-box,
.leaflet-image-layer,
.leaflet-layer {
position: absolute;
left: 0;
top: 0;
}
.leaflet-container {
overflow: hidden;
}
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow {
-webkit-user-select: none;
-moz-user-select: none;
user-select: none;
-webkit-user-drag: none;
}
.leaflet-tile::selection {
background: transparent;
}
.leaflet-safari .leaflet-tile {
image-rendering: -webkit-optimize-contrast;
}
.leaflet-safari .leaflet-tile-container {
width: 1600px;
height: 1600px;
-webkit-transform-origin: 0 0;

// Upload
function loadFile(file) {
  if (!file || !file.type.startsWith('image/')) return;
  const fr = new FileReader();
  fr.onload = () => {
    const im = new Image();
    im.onload = () => {
      const w = im.naturalWidth || 1000, h = im.naturalHeight || 800;
      const old = S.img, sx = w / old.w, sy = h / old.h;
      [S.center, S.door, S.sofa, S.bed, ...S.rooms, ...S.windows].forEach(p => { p.x *= sx; p.y *= sy; });
      if (old.sample) {
        S.windows = []; S.rooms = [];
        S.center = { x: w / 2, y: h / 2 }; S.door = { x: w / 2, y: h * 0.92 };
        S.sofa = { x: w * 0.3, y: h * 0.62, rot: 90 }; S.bed = { x: w * 0.72, y: h * 0.35, rot: 0 };
        S.target = 'center'; S.north = 180;
      }
      S.img = { src: fr.result, w, h, sample: false };
      S.frame = defaultFrame(S.img); S.imgRot = 0; S.libId = null; S.manual = {};
      renderLists(); setupStage(); save();
    };
    im.src = fr.result;
  };
  fr.readAsDataURL(file);
}

}
function boundaryWarn(b) {
  const to8 = Math.min(...[0, 1, 2, 3, 4, 5, 6, 7].map(i => angDiff(b, i * 45 + 22.5)));
  const to24 = Math.min(...Array.from({ length: 24 }, (_, i) => angDiff(b, i * 15 + 7.5)));
  if (to8 < 3) return tr('位於兩卦交界 3° 以內（出卦），請重新確認北方再作判斷。', 'Sits within 3° of the line between two trigrams (出卦). Re-check north before relying on this reading.');
  if (to24 < 1.5) return tr('位於兩山交界（空亡），請重新確認北方再作判斷。', 'Sits on the line between two mountains (空亡). Re-check north before relying on this reading.');
  return '';
}
function targetDomain(t) {
  if (t.key === 'sofa') return { key: 'rest', who: tr('沙發', 'the sofa'), life: tr('休息、家人傾談及待客', 'rest, family talk and hosting') };
  if (t.key === 'bed') return { key: 'sleep', who: tr('床', 'the bed'), life: tr('睡眠、健康及感情', 'sleep, health and relationships') };
  if (t.room) { const lab = pick((ROOM_TYPES[t.room.type] || ROOM_TYPES.other).label); return { key: 'house', who: esc(t.label), life: tr(`${lab}內的活動`, `what happens in the ${lab.toLowerCase()}`) }; }

}
